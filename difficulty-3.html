<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Клавиатурный тренажёр</title>
    <style>
      :root { --bg:#f8fafc; --panel:#fff; --text:#0f172a; --violet:#7c3aed; --border:#e2e8f0; --pink:#ec4899; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Arial, sans-serif; background:var(--bg); color:var(--text); }
      .wrap { width:min(980px,100%); margin:0 auto; padding:10px; }
      .stats { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
      .arena { position:relative; height:156px; border:1px solid var(--border); border-radius:16px; background:linear-gradient(90deg,#e2e8f0,#f8fafc); overflow:hidden; }
      .fly { position:absolute; left:0; top:50%; transform:translateY(-50%); font-weight:900; font-size:42px; background:var(--violet); color:#fff; padding:10px 18px; border-radius:14px; }
      .hint { position:absolute; inset:auto 0 16px; text-align:center; color:#475569; font-weight:700; }
      .kbd-outer { margin-top:8px; }
      .kbd { display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
      .row { display:flex; gap:clamp(2px, 0.8vw, 8px); }
      .key { width:min(7vw, 40px); padding:6px 0; text-align:center; border:1px solid var(--border); border-radius:10px; background:var(--panel); font-weight:700; }
      .key.active { background:var(--violet); color:#fff; }
      .spacekey { min-width:220px; text-align:center; }
      .lives{display:flex;gap:6px}
      .heart{width:20px;height:20px;border:2px solid var(--pink);border-radius:50%;display:inline-block}
      .heart.filled{background:var(--pink)}
      .overlay{display:none;position:absolute;inset:0;background:rgba(15,23,42,.55);align-items:center;justify-content:center;padding:16px}
      .overlay-card{background:#fff;border-radius:12px;padding:16px;max-width:320px;width:100%;text-align:center}
      .actions{display:flex;gap:8px;justify-content:center;margin-top:10px}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="stats">
        <div class="lives" id="lives"></div>
      </div>
      <div class="arena" id="arena">
        <div class="fly" id="fly" lang="en">A</div>
        <div class="hint" id="arenaHint">Нажми ПРОБЕЛ, чтобы начать</div>
        <div class="overlay" id="over">
          <div class="overlay-card">
            <h3>Раунд завершён</h3>
            <div class="actions">
              <button id="retryBtn" type="button">Начать заново</button>
            </div>
          </div>
        </div>
      </div>

      <div class="kbd-outer"><div class="kbd" id="kbd"></div></div>
    </div>

<script>
(() => {
  const keyboardRows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  const letters = 'ETAOINSHRDLU';
  const speed = 105;
  const startLives = 5;
  const roundLength = 10;

  const fly = document.querySelector('#fly');
  const arena = document.querySelector('#arena');
  const livesDisplay = document.querySelector('#lives');
  const overlay = document.querySelector('#over');
  const retry = document.querySelector('#retryBtn');
  const hint = document.querySelector('#arenaHint');
  const keyboard = document.querySelector('#kbd');

  const keys = new Map();
  for (const lettersInRow of keyboardRows) {
    const row = document.createElement('div');
    row.className = 'row';
    for (const letter of lettersInRow) {
      const key = document.createElement('span');
      key.className = 'key';
      key.lang = 'en';
      key.textContent = letter;
      keys.set(letter, key);
      row.append(key);
    }
    keyboard.append(row);
  }
  const spaceKey = document.createElement('span');
  spaceKey.className = 'key spacekey';
  spaceKey.textContent = 'Пробел';
  keyboard.append(spaceKey);

  let running = false;
  let lives = startLives;
  let remainingLetters = [...letters];
  let target = '';
  let x = 0;
  let lastTimestamp = null;

  function renderLives() {
    livesDisplay.replaceChildren();
    livesDisplay.setAttribute('aria-label', `Осталось жизней: ${lives}`);
    for (let index = 0; index < startLives; index += 1) {
      const heart = document.createElement('span');
      heart.className = index < lives ? 'heart filled' : 'heart';
      livesDisplay.append(heart);
    }
  }

  function highlight() {
    for (const [letter, key] of keys) {
      key.classList.toggle('active', running && letter === target);
    }
    spaceKey.classList.toggle('active', !running && Boolean(target));
  }

  function spawn() {
    const index = Math.floor(Math.random() * remainingLetters.length);
    [target] = remainingLetters.splice(index, 1);
    fly.textContent = target;
    x = Math.max(0, arena.clientWidth - fly.offsetWidth - 8);
    fly.style.left = `${x}px`;
    highlight();
  }

  function resetRound() {
    lives = startLives;
    remainingLetters = [...letters];
    running = false;
    overlay.style.display = 'none';
    hint.style.display = 'block';
    reportScore(0);
    renderLives();
    spawn();
    window.focus();
  }

  function reportScore(score) {
    window.parent.postMessage({ type: 'trainer-score', score }, window.location.origin);
  }

  function finishRound() {
    running = false;
    target = '';
    reportScore(lives);
    overlay.style.display = 'flex';
    retry.focus();
    highlight();
  }

  function advanceRound() {
    if (letters.length - remainingLetters.length === roundLength) finishRound();
    else spawn();
  }

  function loseLife() {
    lives -= 1;
    renderLives();
    if (lives === 0) finishRound();
  }

  function loop(timestamp) {
    if (running) {
      x -= speed * (timestamp - (lastTimestamp ?? timestamp)) / 1000;
      fly.style.left = `${x}px`;
      if (x <= 8) {
        loseLife();
        if (running) advanceRound();
      }
    }
    lastTimestamp = timestamp;
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', event => {
    if (event.code === 'Space' && !running && target) {
      event.preventDefault();
      if (event.repeat) return;
      running = true;
      lastTimestamp = null;
      hint.style.display = 'none';
      highlight();
      return;
    }
    if (!running || event.repeat) return;

    const letter = event.key.toUpperCase();
    if (letter === target) {
      advanceRound();
      return;
    }

    if (keys.has(letter)) loseLife();
  });

  retry.addEventListener('click', resetRound);
  window.addEventListener('resize', () => {
    x = Math.min(x, Math.max(0, arena.clientWidth - fly.offsetWidth - 8));
    fly.style.left = `${x}px`;
  });
  renderLives();
  spawn();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
